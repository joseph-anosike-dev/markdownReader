<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader</title>
<style>
  :root {
    --paper: #F4F0E8;
    --paper-dim: #E8E1D2;
    --ink: #1C1A17;
    --ink-soft: #5A5348;
    --red: #7E2A25;
    --red-deep: #5C1F1B;
    --gold: #B08A3E;
    --gold-soft: #DCC894;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  button { font-family: inherit; }

  /* ---------- layout shell ---------- */
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .view { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .view.active { display: flex; }

  /* ---------- setup view ---------- */
  #setup { padding: 24px 18px; overflow-y: auto; }

  #setup h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.6rem;
    margin: 0 0 4px;
  }

  #setup .sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 24px; }

  .dropzone {
    border: 1.5px dashed var(--ink-soft);
    border-radius: 14px;
    padding: 22px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.92rem;
    cursor: pointer;
    margin-bottom: 16px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone.dragover { border-color: var(--gold); background: var(--gold-soft); color: var(--ink); }
  .dropzone strong { color: var(--ink); }
  #fileInput { display: none; }

  #pasteText {
    width: 100%;
    min-height: 200px;
    padding: 14px;
    border: 1px solid var(--ink);
    border-radius: 14px;
    background: #fff;
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.02rem;
    line-height: 1.6;
    color: var(--ink);
    resize: vertical;
  }
  #pasteText:focus { outline: 2px solid var(--gold); outline-offset: -2px; }

  #startBtn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: var(--red);
    color: #fff;
    font-size: 1.02rem;
    font-weight: 600;
    cursor: pointer;
  }
  #startBtn:disabled { background: var(--ink-soft); opacity: 0.5; cursor: default; }
  #startBtn:active:not(:disabled) { background: var(--red-deep); }

  #setupNote { font-size: 0.8rem; color: var(--ink-soft); margin-top: 10px; min-height: 1.2em; }

  /* ---------- player view ---------- */
  #playerTopbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--gold-soft);
  }

  #backBtn {
    border: none;
    background: none;
    color: var(--ink);
    font-size: 0.95rem;
    padding: 8px 6px;
    cursor: pointer;
  }

  #docTitle {
    flex: 1;
    font-size: 0.92rem;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #settingsBtn {
    border: none;
    background: none;
    color: var(--ink);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #settingsBtn:hover { background: var(--paper-dim); }

  #sentences {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 40px;
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 1.15rem;
    line-height: 1.9;
  }

  .sentence {
    padding: 2px 4px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sentence.current { background: var(--red); color: #fff; }
  .sentence.word-active { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; }

  /* ---------- transport bar ---------- */
  #transportBar {
    border-top: 1px solid var(--gold-soft);
    background: var(--paper);
    padding: 10px 18px 18px;
  }

  #progressWrap { padding: 6px 0 10px; cursor: pointer; }
  #progressTrack { height: 5px; background: var(--paper-dim); border-radius: 3px; position: relative; }
  #progressFill { height: 100%; background: var(--gold); border-radius: 3px; width: 0%; }
  #progressMeta {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 26px;
  }

  .icon-btn {
    border: none;
    background: transparent;
    color: var(--ink);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--paper-dim); }
  .icon-btn:focus-visible, #settingsBtn:focus-visible, #startBtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .play-btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    border: none;
    background: var(--red);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--red-deep);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .play-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--red-deep); }

  /* ---------- settings sheet ---------- */
  #settingsSheet {
    position: fixed;
    inset: auto 0 0 0;
    background: #fff;
    border-top: 1px solid var(--ink);
    border-radius: 18px 18px 0 0;
    padding: 18px 20px 26px;
    transform: translateY(100%);
    transition: transform 0.2s ease;
    z-index: 10;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.15);
  }
  #settingsSheet.open { transform: translateY(0); }

  #settingsSheet h2 { font-size: 1rem; margin: 0 0 14px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 6px; }

  select {
    width: 100%;
    padding: 10px 12px;
    font-size: 0.95rem;
    border: 1px solid var(--ink);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 20px) center, calc(100% - 15px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  .speed-row { display: flex; align-items: center; gap: 12px; }
  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; background: var(--ink-soft); border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--gold); border: 2px solid var(--ink); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--gold); border: 2px solid var(--ink); cursor: pointer;
  }
  .speed-value { min-width: 46px; text-align: right; color: var(--ink-soft); font-size: 0.9rem; font-variant-numeric: tabular-nums; }

  #closeSettings {
    width: 100%; padding: 12px; margin-top: 4px;
    border: 1px solid var(--ink); border-radius: 10px;
    background: none; color: var(--ink); font-size: 0.9rem; cursor: pointer;
  }

  details { margin-top: 14px; }
  summary { cursor: pointer; font-size: 0.8rem; color: var(--ink-soft); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  #diag { font-size: 0.78rem; color: var(--ink-soft); white-space: pre-wrap; margin-top: 6px; line-height: 1.5; }

  #scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 9;
  }
  #scrim.open { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP VIEW -->
  <div class="view active" id="setup">
    <h1>Reader</h1>
    <p class="sub">Load a note and listen to it, sentence by sentence.</p>

    <div class="dropzone" id="dropzone">
      Drop a <strong>.md</strong> or <strong>.txt</strong> file here, or tap to choose one
    </div>
    <input type="file" id="fileInput" accept=".md,.txt">

    <textarea id="pasteText" placeholder="...or paste your note text here"></textarea>

    <button id="startBtn" disabled>Start reading</button>
    <div id="setupNote"></div>
  </div>

  <!-- PLAYER VIEW -->
  <div class="view" id="player">
    <div id="playerTopbar">
      <button id="backBtn">‹ Back</button>
      <div id="docTitle">Untitled</div>
      <button id="settingsBtn" title="Voice &amp; speed" aria-label="Voice and speed settings">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M19.4 13a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V19a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 13a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 2.6a1.7 1.7 0 0 0 1-1.56V1a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 7c.15.36.34.6.6.75" stroke="currentColor" stroke-width="1.2" fill="none" opacity="0"/></svg>
      </button>
    </div>

    <div id="sentences"></div>

    <div id="transportBar">
      <div id="progressWrap">
        <div id="progressTrack"><div id="progressFill"></div></div>
        <div id="progressMeta">
          <span id="progressCount">0 / 0</span>
          <span id="progressEta">&nbsp;</span>
        </div>
      </div>
      <div class="transport">
        <button class="icon-btn" id="prevBtn" title="Previous sentence">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M18 6v12M6 12l10-7v14z" fill="currentColor"/></svg>
        </button>
        <button class="play-btn" id="playBtn" title="Play">
          <svg id="playIcon" width="26" height="26" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" title="Next sentence">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 6v12M18 12L8 5v14z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>

<div id="scrim"></div>
<div id="settingsSheet">
  <h2>Voice &amp; speed</h2>
  <div class="field">
    <label for="voiceSel">Voice</label>
    <select id="voiceSel"></select>
  </div>
  <div class="field">
    <label for="speedRange">Speed</label>
    <div class="speed-row">
      <input type="range" id="speedRange" min="0.5" max="2" step="0.05" value="1">
      <span class="speed-value" id="speedLabel">1.0x</span>
    </div>
  </div>
  <button id="closeSettings">Done</button>
  <details>
    <summary>Status</summary>
    <div id="diag"></div>
  </details>
</div>

<script>
const synth = window.speechSynthesis || null;

// ---- elements ----
const setupView = document.getElementById('setup');
const playerView = document.getElementById('player');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const pasteText = document.getElementById('pasteText');
const startBtn = document.getElementById('startBtn');
const setupNote = document.getElementById('setupNote');

const backBtn = document.getElementById('backBtn');
const docTitle = document.getElementById('docTitle');
const settingsBtn = document.getElementById('settingsBtn');
const sentencesEl = document.getElementById('sentences');

const progressFill = document.getElementById('progressFill');
const progressTrack = document.getElementById('progressTrack');
const progressWrap = document.getElementById('progressWrap');
const progressCount = document.getElementById('progressCount');
const progressEta = document.getElementById('progressEta');

const prevBtn = document.getElementById('prevBtn');
const playBtn = document.getElementById('playBtn');
const nextBtn = document.getElementById('nextBtn');

const scrim = document.getElementById('scrim');
const settingsSheet = document.getElementById('settingsSheet');
const voiceSel = document.getElementById('voiceSel');
const speedRange = document.getElementById('speedRange');
const speedLabel = document.getElementById('speedLabel');
const closeSettings = document.getElementById('closeSettings');
const diag = document.getElementById('diag');

const ICON_PLAY = '<path d="M7 5v14l12-7z" fill="currentColor"/>';
const ICON_PAUSE = '<rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/>';

// ---- state ----
let sentences = [];   // { text, el }
let idx = 0;
let playing = false;  // true = we intend continuous playback / auto-advance

// ---- helpers ----
function stripMarkdown(s) {
  return s
    .replace(/```[\s\S]*?```/g, '')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/!\[.*?\]\(.*?\)/g, '')
    .replace(/\[([^\]]+)\]\(.*?\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/[*_~>]/g, '')
    .trim();
}

/**
 * splitSentences(text)
 *
 * Splits text into an array of sentences — built for feeding a
 * text-to-speech / "read aloud" pipeline one sentence at a time.
 *
 * KEY DESIGN CHANGE from a fragment-matching regex:
 * Instead of using String.match() to pull sentence-shaped fragments out
 * (which can silently SKIP a character position if no alternative matches
 * there — this is very likely what caused your "disappearing sentence"
 * bug), this version finds each sentence-boundary position with a regex,
 * then SLICES the original string between boundaries. Slicing guarantees
 * every character in the input ends up in the output somewhere — text
 * cannot vanish, it can only end up in the wrong place.
 *
 * Protected from being mistaken for a sentence end:
 *  - Common abbreviations (Mr., Dr., vs., etc., e.g., i.e., a.m./p.m., U.S., U.K., ...)
 *  - Initials (J.K. Rowling, A. Smith)
 *  - Decimals, version numbers, times, IPs (3.14, v2.0.1, 10.30, 192.168.0.1)
 *  - URLs and emails (including query strings / paths with . ? ! in them)
 *  - Bare domains (example.com, site.co.uk, mysite.ng)
 *  - Markdown links/images ([label](url "title")), inline code `like.this()`,
 *    and fenced ``` code blocks ```
 *  - Numbered-list markers at the start of a line ("1. Item")
 *
 * Also normalizes missing whitespace after real terminal punctuation
 * ("end.Next" -> "end. Next") so typo run-ons don't merge two sentences.
 *
 * Known limitations (inherent to any regex-based splitter, not just this one):
 *  - A single capital letter that legitimately ends a sentence right before
 *    another capitalized word ("Turn left at Point A. Then continue.") can
 *    be mistaken for an initial and left unsplit. True disambiguation needs
 *    an NLP sentence tokenizer, not regex.
 *  - Nested dialogue with multiple sentences inside one quote
 *    (`He said, "Wait. Stop. Now."`) will still split at each internal
 *    period — this mirrors the original behavior and is a design choice,
 *    not a bug; merge them yourself downstream if you want the whole quote
 *    read as one unit.
 */
function splitSentences(text) {
  if (!text || typeof text !== 'string') return [];

  // Placeholders that contain none of . ! ? so they're invisible to the
  // boundary regex below. Restored to real punctuation at the very end.
  const maskPunct = (s) =>
    s.replace(/\./g, '\u0001').replace(/\?/g, '\u0002').replace(/!/g, '\u0003');
  const unmaskPunct = (s) =>
    s.replace(/\u0001/g, '.').replace(/\u0002/g, '?').replace(/\u0003/g, '!');

  // For URL-like matches: strip trailing punctuation FIRST so a real
  // sentence-ending character right after the URL still works, then mask
  // only the "core" of the match.
  const maskCoreKeepTrail = (match) => {
    const trailMatch = match.match(/[.,!?;:'"”’)\]]+$/);
    const trail = trailMatch ? trailMatch[0] : '';
    const core = trail ? match.slice(0, -trail.length) : match;
    return maskPunct(core) + trail;
  };

  let t = text;

  // --- Markdown-specific protection (safe to leave in even for plain text) ---
  t = t.replace(/```[\s\S]*?```/g, (m) => maskPunct(m));           // fenced code blocks
  t = t.replace(/`[^`\n]+`/g, (m) => maskPunct(m));                // inline code
  t = t.replace(/\]\(([^)]+)\)/g, (m, inner) => `](${maskPunct(inner)})`); // link/image target

  // --- URLs, emails, domains (handles query strings, so a "?" in a URL
  //     is no longer mistaken for a sentence end) ---
  t = t.replace(/\b(?:https?:\/\/|www\.)\S+/gi, maskCoreKeepTrail);
  t = t.replace(/\b[\w.+-]+@[\w-]+\.[\w.-]+\b/g, (m) => maskPunct(m));
  t = t.replace(
    /\b[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|io|co|ng|gov|edu|info|biz|ai|dev|app|xyz|co\.uk|co\.ng|org\.ng|gov\.ng)(?:\/\S*)?\b/gi,
    maskCoreKeepTrail
  );

  // --- Decimals, version numbers, times, IPs ---
  t = t.replace(/\b\d+(?:\.\d+)+\b/g, (m) => maskPunct(m));

  // --- Abbreviations that already contain internal periods (longest first,
  //     so "U.S.A." isn't cut short by a "U.S." match) ---
  const dottedAbbrevs = [
    'U\\.S\\.A\\.', 'U\\.S\\.', 'U\\.K\\.', 'U\\.N\\.',
    'e\\.g\\.', 'i\\.e\\.', 'cf\\.', 'viz\\.',
    'a\\.m\\.', 'p\\.m\\.', 'A\\.M\\.', 'P\\.M\\.',
  ];
  t = t.replace(new RegExp('\\b(?:' + dottedAbbrevs.join('|') + ')', 'g'), (m) => maskPunct(m));

  // --- Abbreviations with a single trailing period ---
  const simpleAbbrevs = [
    'Mr','Mrs','Ms','Mx','Dr','Prof','Sr','Jr','St','Rev','Gen','Sgt','Col','Lt','Capt','Fr','Hon',
    'vs','etc','approx','dept','univ','al',
    'Jan','Feb','Mar','Apr','Jun','Jul','Aug','Sep','Sept','Oct','Nov','Dec',
    'Mon','Tue','Tues','Wed','Thu','Thur','Thurs','Fri','Sat','Sun',
    'Vol','pp','fig','Fig','ch','Ch','sec','Sec','para','Para',
  ];
  t = t.replace(new RegExp('\\b(' + simpleAbbrevs.join('|') + ')\\.', 'g'), (m) => maskPunct(m));

  // --- Initials: "J.K. Rowling", "A. Smith" ---
  t = t.replace(/\b([A-Z])\.(?=[A-Z]\.)/g, (m) => maskPunct(m));      // first of a run: "J."
  t = t.replace(/\b([A-Z])\.(?=\s[A-Z][a-z])/g, (m) => maskPunct(m)); // last before a name: "K." / "A."

  // --- Numbered-list markers at the start of a line: "1. Item" ---
  t = t.replace(/^(\s*\d+)\.(?=\s+\S)/gm, (m) => maskPunct(m));

  // --- Fix missing whitespace after a REAL terminal punctuation mark, so
  //     typo run-ons don't merge two sentences into one ("end.Next" -> "end. Next") ---
  t = t.replace(/([.!?])(["'”’»)\]]*)([A-Z])/g, (m, p1, quote, cap) => `${p1}${quote} ${cap}`);

  // --- Split into paragraphs, then slice each into sentences by boundary ---
  const paragraphs = t.split(/\n+/).map((p) => p.trim()).filter(Boolean);
  const out = [];
  const boundaryRe = /[.!?]+(?:["'”’»)\]]*)?(?=\s|$)/g;

  paragraphs.forEach((para) => {
    let start = 0;
    let m;
    boundaryRe.lastIndex = 0;
    while ((m = boundaryRe.exec(para)) !== null) {
      const end = m.index + m[0].length;
      const sentence = unmaskPunct(para.slice(start, end)).trim();
      if (sentence) out.push(sentence);
      start = end;
    }
    // Anything left over (no terminal punctuation at all) is still captured
    // here — this is what guarantees no text can silently disappear.
    const rest = unmaskPunct(para.slice(start)).trim();
    if (rest) out.push(rest);
  });

  return out;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { splitSentences };
}


function wordCount(s) { return (s.match(/\S+/g) || []).length; }

// ---- voices ----
function populateVoices() {
  if (!synth) { reportDiag(); return; }
  const voices = synth.getVoices();
  const current = voiceSel.value;
  voiceSel.innerHTML = '';
  const def = document.createElement('option');
  def.value = ''; def.textContent = 'System default';
  voiceSel.appendChild(def);
  voices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `${v.name} (${v.lang})`;
    voiceSel.appendChild(o);
  });
  if (current) voiceSel.value = current;
  reportDiag();
}

function reportDiag() {
  const voices = synth ? synth.getVoices() : [];
  diag.textContent = `speechSynthesis: ${synth ? 'present' : 'missing'}\nvoices reported: ${voices.length}`;
}

if (synth) {
  synth.getVoices();
  synth.addEventListener('voiceschanged', populateVoices);
} else {
  setupNote.textContent = 'This browser has no built-in speech engine — try opening this file in Chrome.';
}
populateVoices();

speedRange.addEventListener('input', () => { speedLabel.textContent = parseFloat(speedRange.value).toFixed(2) + 'x'; });

// ---- setup view: loading text ----
function setSourceText(raw, label) {
  const cleaned = stripMarkdown(raw);
  pasteText.value = cleaned;
  startBtn.disabled = !cleaned.trim();
  setupNote.textContent = cleaned.trim() ? `Loaded ${wordCount(cleaned)} words${label ? ' from ' + label : ''}.` : '';
}

pasteText.addEventListener('input', () => {
  startBtn.disabled = !pasteText.value.trim();
});

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));
['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
dropzone.addEventListener('drop', (e) => loadFile(e.dataTransfer.files[0]));

let loadedName = 'Untitled';
function loadFile(f) {
  if (!f) return;
  loadedName = f.name;
  const r = new FileReader();
  r.onload = () => setSourceText(r.result, f.name);
  r.readAsText(f);
}

startBtn.addEventListener('click', () => {
  const text = stripMarkdown(pasteText.value);
  if (!text.trim()) return;
  buildPlayer(text);
});

// ---- building the player ----
function buildPlayer(text) {
  const raw = splitSentences(text);
  sentences = raw.map(t => ({ text: t, el: null }));
  idx = 0;
  playing = false;

  sentencesEl.innerHTML = '';
  sentences.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'sentence';
    div.textContent = s.text;
    div.addEventListener('click', () => jumpTo(i, true));
    sentencesEl.appendChild(div);
    s.el = div;
  });

  docTitle.textContent = loadedName !== 'Untitled' ? loadedName : `${sentences.length} sentences`;
  updateHighlight();
  updateProgress();
  setPlayingUI(false);

  setupView.classList.remove('active');
  playerView.classList.add('active');
}

backBtn.addEventListener('click', () => {
  stopPlayback();
  playerView.classList.remove('active');
  setupView.classList.add('active');
});

// ---- playback core (sentence-queue, never relies on native pause/resume) ----
function speakSentence(i) {
  if (!synth) return;
  if (i < 0) i = 0;
  if (i >= sentences.length) { playing = false; setPlayingUI(false); return; }
  idx = i;
  updateHighlight();
  updateProgress();

  synth.cancel();
  const u = new SpeechSynthesisUtterance(sentences[i].text);
  u.rate = parseFloat(speedRange.value);
  const vIdx = voiceSel.value;
  if (vIdx !== '') u.voice = synth.getVoices()[vIdx];

  u.onend = () => { if (playing) speakSentence(idx + 1); };
  u.onerror = () => { setPlayingUI(false); };
  synth.speak(u);
}

function play() {
  if (!synth) { setupNote.textContent = 'No speech engine available.'; return; }
  playing = true;
  setPlayingUI(true);
  speakSentence(idx);
}

function pausePlayback() {
  playing = false;
  if (synth) synth.cancel(); // cancel, don't rely on the unreliable native pause()
  setPlayingUI(false);
}

function stopPlayback() {
  playing = false;
  if (synth) synth.cancel();
  idx = 0;
  setPlayingUI(false);
}

function jumpTo(i, autoplay) {
  idx = Math.max(0, Math.min(sentences.length - 1, i));
  if (autoplay) { playing = true; setPlayingUI(true); speakSentence(idx); }
  else { if (synth) synth.cancel(); updateHighlight(); updateProgress(); }
}

playBtn.addEventListener('click', () => { playing ? pausePlayback() : play(); });
prevBtn.addEventListener('click', () => jumpTo(idx - 1, playing));
nextBtn.addEventListener('click', () => jumpTo(idx + 1, playing));

progressWrap.addEventListener('click', (e) => {
  const rect = progressTrack.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  jumpTo(Math.round(ratio * (sentences.length - 1)), playing);
});

// ---- UI updates ----
function setPlayingUI(isPlaying) {
  const iconSvg = playBtn.querySelector('svg');
  if (iconSvg) {
    iconSvg.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
  }
}

function updateHighlight() {
  sentences.forEach((s, i) => s.el.classList.toggle('current', i === idx));
  const cur = sentences[idx];
  if (cur) cur.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function updateProgress() {
  const total = sentences.length || 1;
  progressFill.style.width = `${(idx / Math.max(1, total - 1)) * 100}%`;
  progressCount.textContent = `${Math.min(idx + 1, total)} / ${total}`;

  const wordsTotal = sentences.reduce((n, s) => n + wordCount(s.text), 0);
  const wordsDone = sentences.slice(0, idx).reduce((n, s) => n + wordCount(s.text), 0);
  const wordsLeft = Math.max(0, wordsTotal - wordsDone);
  const speed = parseFloat(speedRange.value) || 1;
  const minsLeft = wordsLeft / (155 * speed);
  progressEta.textContent = minsLeft < 1 ? '< 1 min left' : `~${Math.round(minsLeft)} min left`;
}

// ---- settings sheet ----
function openSettings() { settingsSheet.classList.add('open'); scrim.classList.add('open'); }
function closeSettingsSheet() { settingsSheet.classList.remove('open'); scrim.classList.remove('open'); }
settingsBtn.addEventListener('click', openSettings);
closeSettings.addEventListener('click', closeSettingsSheet);
scrim.addEventListener('click', closeSettingsSheet);

speedRange.addEventListener('change', () => { if (playing) speakSentence(idx); else updateProgress(); });
voiceSel.addEventListener('change', () => { if (playing) speakSentence(idx); });
</script>
</body>
</html>
